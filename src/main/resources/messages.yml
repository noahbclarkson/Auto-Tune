# ============================================
# Auto-Tune Messages Configuration
# Supports MiniMessage format for colors and formatting
# Placeholders use <name> syntax (MiniMessage tags)
# ============================================

prefix: "<gradient:#00d4ff:#00ff88>Auto-Tune</gradient> <dark_gray>»</dark_gray> "

# General messages
general:
  reload-success: "<green>Configuration reloaded successfully!"
  reload-fail: "<red>Failed to reload configuration. Check console for errors."
  no-permission: "<red>You don't have permission to do that."
  player-only: "<red>This command can only be used by players."
  invalid-amount: "<red>Invalid amount specified."
  invalid-item: "<red>That item is not available in the shop."
  invalid-query: "<red>Invalid search query."

# Shop messages
shop:
  opened: "<gray>Opening shop..."
  item-not-found: "<red>Item not found in the shop."
  insufficient-funds: "<red>You don't have enough money. Required: <gold><amount></gold>"
  insufficient-items: "<red>You don't have enough items to sell."
  insufficient-space: "<red>You don't have enough inventory space."
  purchase-success: "<green>Purchased <gold><amount>x <item></gold> for <gold><price></gold>!"
  sale-success: "<green>Sold <gold><amount>x <item></gold> for <gold><price></gold>!"
  transaction-cancelled: "<yellow>Transaction cancelled."
  cart-updated: "<gray>Cart updated: <white><item></white> x<amount>"
  cart-cleared: "<yellow>Cart cleared."
  checkout-confirm: "<gold>Click to confirm: <white><action></white> for <gold><total></gold>"
  price-increased: "<green>\u25B2 <item> price increased to <price>"
  price-decreased: "<red>\u25BC <item> price decreased to <price>"
  search-no-results: "<yellow>No results found for <gold><query></gold>."
  not-buyable: "<red>This item is not yet available for purchase. It must be sold first."
  search-prompt: "<aqua>Type your search query in chat <gray>(or 'cancel' to cancel)</gray>"
  search-cancelled: "<yellow>Search cancelled."
  trends-title: "<gold>Market Trends"

# Sell GUI messages
sell:
  opened: "<gray>Drop items into the GUI to sell them. Close to confirm."
  summary: "<green>Sold <gold><amount></gold> items for <gold><price></gold>!"
  nothing-sold: "<yellow>No items were sold."

autosell:
  item-enabled: "<green>Autosell enabled for <gold><item></gold>."
  item-disabled: "<red>Autosell disabled for <gold><item></gold>."
  all-enabled: "<green>Autosell enabled for all items."
  all-disabled: "<red>Autosell disabled for all items."
  sold: "<green>Autosold <gold><amount>x <item></gold> for <gold><price></gold>"
  inventory-sold: "<green>Sold <gold><amount></gold> items from inventory for <gold><price></gold>!"

# Loan messages
loan:
  taken: "<green>Loan approved! <gold><amount></gold> deposited at <gold><rate></gold> for <gold><term></gold> days. Due: <yellow><due_date></yellow>"
  repaid: "<green>Loan repaid successfully! Thank you for your business."
  partial-repay: "<green>Partial payment of <gold><amount></gold> accepted. Remaining: <gold><remaining></gold>"
  insufficient-credit: "<red>Your credit score is too low for a loan. Minimum: <gold><required></gold>"
  max-exceeded: "<red>Maximum loan amount is <gold><max></gold> based on your credit history."
  already-active: "<red>You already have an active loan. Pay it off first."
  no-active-loan: "<yellow>You don't have any active loans."
  interest-applied: "<yellow>Interest applied to your loan. New balance: <gold><balance></gold>"
  warning-due: "<gold>\u26A0 Your loan balance of <gold><amount></gold> is due in <yellow><time_left></yellow>!"
  overdue: "<red>\u26A0 Your loan is overdue! Balance: <gold><amount></gold>. Log back in regularly — it will be processed soon."
  defaulted: "<red>Your loan has defaulted! Credit score reduced by <gold><penalty></gold> points."
  credit-score: "<gray>Your credit score: <gold><score></gold>"

# Error messages
error:
  database: "<red>A database error occurred. Please try again later."
  economy: "<red>Economy service unavailable. Please contact an administrator."
  internal: "<red>An internal error occurred. Please report this to an administrator."

# Admin messages
admin:
  debug-enabled: "<yellow>Debug mode enabled."
  debug-disabled: "<yellow>Debug mode disabled."
  price-set: "<green>Base price for <gold><item></gold> set to <gold><price></gold>."
  item-added: "<green>Item <gold><item></gold> added to the shop."
  item-removed: "<yellow>Item <gold><item></gold> removed from the shop."
  relation-set: "<green>Relation set: <gold><item_a></gold> \u2194 <gold><item_b></gold> (correlation: <correlation>)"
  buyable-set: "<green>Buyable state for <gold><item></gold> set to <gold><state></gold>."
  custom-item-added: "<green>Custom item <gold><item></gold> added to the shop at <gold><price></gold>."
  hold-item: "<red>Hold an item in your main hand to add to the shop."
  invalid-state: "<red>Invalid state. Valid values: true, false, auto"

# Economy messages
economy:
  gdp: "<gray>GDP (24h): <gold><gdp></gold>"
  inflation: "<gray>Inflation: <gold><label></gold>"
  debt: "<gray>Total Debt: <gold><debt></gold>"
