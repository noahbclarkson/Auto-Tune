[package]
name = "api-server"
version = "0.1.0"
edition = "2021"
description = "Auto-Tune price discovery API server"

[dependencies]
actix-web = "4"
sqlx = { version = "0.7", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
futures-util = "0.3"
price-solver = { path = "../price-solver" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
